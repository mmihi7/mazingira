<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStreetMap OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .callback-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .error {
            color: #f44336;
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div id="loading" class="spinner"></div>
        <div id="status"></div>
        <div id="message"></div>
    </div>

    <script>
        // Handle OAuth callback
        function handleCallback() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const accessToken = params.get('access_token');
            const tokenType = params.get('token_type');
            const expiresIn = params.get('expires_in');
            const error = params.get('error');
            
            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');
            const loadingEl = document.getElementById('loading');
            
            loadingEl.style.display = 'none';
            
            if (error) {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Authentication Failed';
                messageEl.textContent = `Error: ${error}. Please try again.`;
                
                setTimeout(() => {
                    window.close();
                    window.opener?.postMessage({ type: 'osm_auth_error', error }, '*');
                }, 3000);
            } else if (accessToken) {
                statusEl.className = 'success';
                statusEl.textContent = '✅ Authentication Successful';
                messageEl.textContent = 'Redirecting to Mazingira Intelligence Platform...';
                
                // Store tokens securely
                const authData = {
                    access_token: accessToken,
                    token_type: tokenType,
                    expires_in: expiresIn,
                    expires_at: Date.now() + (parseInt(expiresIn) * 1000)
                };
                
                localStorage.setItem('osm_auth_data', JSON.stringify(authData));
                
                // Send success message to parent window
                window.opener?.postMessage({ 
                    type: 'osm_auth_success', 
                    authData 
                }, '*');
                
                // Redirect back to main app
                setTimeout(() => {
                    window.location.href = 'https://mazingira-expert.vercel.app';
                }, 2000);
            } else {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Invalid Response';
                messageEl.textContent = 'No authentication data received.';
            }
        }
        
        // Handle callback immediately
        handleCallback();
    </script>
</body>
</html>
